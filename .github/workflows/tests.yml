name: Python tests

on:
  push:
    branches:
      - feature/openai-localizer
      - 'feature/localizer-2-*'
  pull_request:
    branches:
      - master
      - feature/vps-migration-isolated-20261114
      - feature/vps-public-demo-20261114

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m pytest -q

  postgres-contexts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: localizer
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: localizer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localizer -d localizer"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LOCALIZER_DATABASE_URL: postgresql+psycopg://localizer:ci-only-password@127.0.0.1:5432/localizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply real PostgreSQL migrations
        run: alembic upgrade head
      - name: Seed and publish language-neutral profiles on PostgreSQL
        run: |
          python -m scripts.seed_contexts
          python -c "import os; from app.contexts.repository import resolve_context, list_public_contexts; url=os.environ['LOCALIZER_DATABASE_URL']; c=resolve_context(url, 'electronics'); assert c.version == 1 and c.style['tone'] == 'precise and professional'; assert len(list_public_contexts(url)) == 6 and resolve_context(url, 'military').rules[0].preferred == 'наградные планки'"
          python -m scripts.publish_professional_profiles
          python -m scripts.publish_professional_profiles
          python -c "import os; from app.contexts.repository import resolve_context, list_public_contexts, build_context_prompt; url=os.environ['LOCALIZER_DATABASE_URL']; v1=resolve_context(url, 'electronics', 1); v2=resolve_context(url, 'electronics'); assert v1.version == 1 and not v1.profiles; assert v2.version == 2 and len(v2.profiles) == 2; assert v2.rules == v1.rules; assert len(list_public_contexts(url)) == 6 and all(item['version'] == 2 for item in list_public_contexts(url)); assert 'electronics' in build_context_prompt(v2, 'de')"
          python -m scripts.publish_semantic_profiles
          python -m scripts.publish_semantic_profiles
          python -c "import os; from app.contexts.repository import resolve_context, list_public_contexts, build_context_prompt; from app.constants import SEMANTIC_ASSIGNMENT_PREFIX, SPECIALIST_ASSIGNMENT_PREFIX; url=os.environ['LOCALIZER_DATABASE_URL']; a=resolve_context(url, 'electronics', 1); b=resolve_context(url, 'electronics', 2); c=resolve_context(url, 'electronics', 3); assert len(list_public_contexts(url)) == 6 and all(item['version'] == 3 for item in list_public_contexts(url)); assert a.profiles == (); assert b.rules == c.rules == a.rules; assert b.profiles[-1].interpretation_method is None; assert c.profiles[-1].interpretation_method == 'evidence_before_domain'; assert build_context_prompt(b, 'de').startswith(SPECIALIST_ASSIGNMENT_PREFIX); assert build_context_prompt(c, 'he').startswith(SEMANTIC_ASSIGNMENT_PREFIX)"
