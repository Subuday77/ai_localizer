# Isolated Compose project for AI Localizer; no shared networks/volumes with Quiz.
name: ai-localizer

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # Fail closed for VPS: the container refuses to start without key hashes.
    environment:
      LOCALIZER_REQUIRE_API_KEY: "true"
      # Off by default. Enable only after configuring Caddy and CORS.
      LOCALIZER_DEMO_ENABLED: "${LOCALIZER_DEMO_ENABLED:-false}"
      LOCALIZER_DEMO_DB_PATH: "/var/lib/localizer-demo/requests.sqlite3"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - localizer_demo_quota:/var/lib/localizer-demo
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
      quiz_localizer:
        aliases:
          - localizer-api
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

# Explicit, private network shared only with the Quiz backend on this VPS.
# Create once with: docker network create --internal ai-localizer-clients
networks:
  quiz_localizer:
    external: true
    name: ai-localizer-clients

volumes:
  # Persist demo request counters across recreates/restarts.
  localizer_demo_quota:
