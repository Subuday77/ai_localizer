# Isolated Compose project for AI Localizer; no shared networks/volumes with Quiz.
name: ai-localizer

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # Fail closed for VPS: the container refuses to start without key hashes.
    environment:
      LOCALIZER_REQUIRE_API_KEY: "true"
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
